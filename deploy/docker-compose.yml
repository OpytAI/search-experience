# Docs site for Dokploy (and local smoke).
# Build context is the monorepo root so docs/, src/, and lockfiles resolve.
#
#   docker compose -f deploy/docker-compose.yml build
#   docker compose -f deploy/docker-compose.yml up
#
# Product package under /agentos-search/ is fetched from GitHub Releases
# (latest by default) — no Bazel on the host.
#
# Do not publish host :80 here. Dokploy’s reverse proxy already owns 80/443 and
# routes to this service on the compose network. Binding 0.0.0.0:80 fails with
# “port is already allocated”. Local smoke: docker compose run/up still reaches
# the container via the service name on port 80, or add a temporary ports mapping.

services:
  docs:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        RELEASE_BASE: https://github.com/OpytAI/search-experience/releases/latest/download
    expose:
      - "80"
    restart: unless-stopped
